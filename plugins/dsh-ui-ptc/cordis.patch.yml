# dsh-ui-ptc bundle patch: the PTC display row, plus the vendored dsh-ops
# components, unchanged from dsh-ops 0.3.1's own patch except for the package
# name. The row ids stay `dsh-ops-*` so a profile override written for the
# original package keeps applying.
- insert:
    - id: dshui-ptc
      name: dsh-ui-ptc
    - id: dsh-ops-shell
      name: dsh-ui-ptc/ops/shell
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: false
    - id: dsh-ops-file
      name: dsh-ui-ptc/ops/file
      config:
        promptPolicy: true
        enableShellTools: false
        required: false
        toolCallTimeoutMs: 300000
    - id: dsh-ops-background
      name: dsh-ui-ptc/ops/background
      disabled: true
      config:
        promptPolicy: true
        enableShellTools: true
        required: false
        toolCallTimeoutMs: 300000
    - id: dsh-ops-ptc
      name: dsh-ui-ptc/ops/ptc
      disabled: true
      config:
        required: false
- id: preset-ptc
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: ptc
    name: "PTC 模式"
    description: "包含标准模式的所有能力，更适合批量调用工具，并对结果进行筛选、整理、去重、统计或汇总的任务。"
    order: 2
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        # dsh-ui-ptc 的 ops 组件发布无前缀的 bash，原生行让位，避免同名注册冲突。
        disabled: true
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        # dsh-ui-ptc 的 ops 组件发布无前缀的 glob / grep，原生行让位。
        disabled: true
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          # agent-team / tool-agent-team stay in the host base layer, where they
          # are already mounted once for every preset. Mounting either here
          # registers agentTeams a second time inside the preset scope and the
          # whole preset fails to load.
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            disabled: true
            config:
              provider: spawn
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-executor-ptc
        name: '@deepseek-ai/dsh-tool-executor-ptc'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      # Upstream 0.2.2-rc.2 mounts tool-office in this preset; the wholesale
      # override would otherwise hide the Office tools from PTC mode.
      - id: tool-office
        name: '@deepseek-ai/dsh-tool-office'
